# GitLab CI/CD for linkding.
# Covers the Verify, Package, Secure, Configure and Release stages of the
# DevSecOps lifecycle.
# Runs on merge requests and on the default branch.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Security/DAST.gitlab-ci.yml

variables:
  # Security templates only run on branch pipelines unless this is set.
  AST_ENABLE_MR_PIPELINES: "true"
  APP_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  BOT_IMAGE: $CI_REGISTRY_IMAGE/slackbot:$CI_COMMIT_SHORT_SHA

  # Google Cloud targets created by the OpenTofu code in infra/.
  # None of these values is a secret.
  GCP_PROJECT: linkding-transcend
  GCP_PROJECT_NUMBER: "248896301327"
  GCP_REGION: asia-southeast1
  GCP_REGISTRY: asia-southeast1-docker.pkg.dev/linkding-transcend/linkding
  GCP_DEPLOYER: gitlab-deployer@linkding-transcend.iam.gserviceaccount.com
  GCP_IDENTITY_PROVIDER: projects/248896301327/locations/global/workloadIdentityPools/gitlab/providers/gitlab-com

  # TEMPORARY: lint, tests, infra validation and all security scanners are switched off to keep
  # the pipeline fast while deployment is being set up.
  # To switch everything back on, delete the six lines below.
  VERIFY_DISABLED: "true"
  SAST_DISABLED: "true"
  SECRET_DETECTION_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"
  CONTAINER_SCANNING_DISABLED: "true"
  DAST_DISABLED: "true"

stages:
  - lint
  - test
  - build
  - scan
  - dast
  - staging
  - production

default:
  interruptible: true

# ---------------------------------------------------------------- Verify

.python:
  image: python:3.13-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - pip install --quiet --root-user-action=ignore uv==0.8.13
    # uwsgi is only needed to serve the app and has no prebuilt wheel
    - uv sync --frozen --no-install-package uwsgi

lint:
  extends: .python
  stage: lint
  rules:
    - if: $VERIFY_DISABLED != "true"
  script:
    - uv run --no-sync ruff check bookmarks --output-format gitlab --output-file gl-code-quality-report.json --exit-zero
    - uv run --no-sync ruff check bookmarks
    - uv run --no-sync ruff format --check bookmarks
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

test:
  extends: .python
  stage: test
  rules:
    - if: $VERIFY_DISABLED != "true"
  script:
    - mkdir -p data
    - >
      uv run --no-sync --with pytest-cov==7.1.0 pytest -n auto
      --junitxml=report.xml
      --cov=bookmarks --cov-report=term:skip-covered --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ------------------------------------------------------------- Configure
# Infrastructure is applied from a maintainer's machine. The pipeline only
# checks that the OpenTofu files are well formed.

infra-validate:
  stage: lint
  image: alpine:3.22
  script:
    - apk add --no-cache --quiet opentofu
    - tofu -chdir=infra fmt -check -recursive -diff
    - tofu -chdir=infra init -backend=false -input=false
    - tofu -chdir=infra validate
  rules:
    - if: $VERIFY_DISABLED == "true"
      when: never
    - changes:
        - infra/**/*

# --------------------------------------------------------------- Package

build-image:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    BUILD_CACHE: $CI_REGISTRY_IMAGE/buildcache:latest
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # A container builder is needed to store the cache of every build stage in the registry
    - docker context create ci
    - docker buildx create --use --driver docker-container ci
    - >
      docker buildx build --file docker/default.Dockerfile --target linkding
      --cache-from "type=registry,ref=$BUILD_CACHE"
      --cache-to "type=registry,ref=$BUILD_CACHE,mode=max"
      --tag "$APP_IMAGE" --load .
    # Smoke test: start the image and wait until /health reports a working database
    - docker run --detach --name app "$APP_IMAGE"
    - |
      for i in $(seq 1 40); do
        docker exec app curl --fail --silent http://localhost:9090/health && break
        sleep 3
      done
    - docker exec app curl --fail --silent http://localhost:9090/health | grep healthy || { docker logs app; exit 1; }
    - docker push "$APP_IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$APP_IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

# ---------------------------------------------------------------- Secure
# Secret detection, SAST, IaC scanning and dependency scanning come from the
# included templates and need no extra configuration.

container_scanning:
  stage: scan
  variables:
    CS_IMAGE: $APP_IMAGE
    CS_DOCKERFILE_PATH: docker/default.Dockerfile

dast:
  services:
    - name: $APP_IMAGE
      alias: app
  variables:
    # Throwaway account that only exists inside the scanned container
    LD_SUPERUSER_NAME: dast
    LD_SUPERUSER_PASSWORD: dast-scan-only
    DAST_TARGET_URL: http://app:9090
    DAST_TARGET_CHECK_TIMEOUT: "180"
    DAST_AUTH_URL: http://app:9090/login/
    DAST_AUTH_USERNAME: dast
    DAST_AUTH_PASSWORD: dast-scan-only
    DAST_AUTH_USERNAME_FIELD: "name:username"
    DAST_AUTH_PASSWORD_FIELD: "name:password"
    DAST_AUTH_SUBMIT_FIELD: "css:input[type=submit]"
    DAST_AUTH_SUCCESS_IF_AT_URL: http://app:9090/bookmarks
    DAST_AUTH_REPORT: "true"
    DAST_SCOPE_EXCLUDE_URLS: http://app:9090/logout/
  artifacts:
    when: always
    paths:
      - gl-dast-debug-auth-report.html
    reports:
      dast: gl-dast-report.json

# --------------------------------------------------------------- Release
# Merging into the default branch deploys to staging automatically.
# Production is a manual step and is followed by a GitLab Release.
#
# Jobs sign in to Google Cloud with a short-lived OIDC token issued by GitLab.
# Google accepts it only from this project and its protected default branch,
# so no Google credential is stored in GitLab.

.deploy:
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine
  interruptible: false
  variables:
    GIT_STRATEGY: none
    CLOUDSDK_CORE_PROJECT: $GCP_PROJECT
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    SERVICE: linkding-$CI_ENVIRONMENT_NAME
    SERVICE_URL: https://linkding-$CI_ENVIRONMENT_NAME-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app
    TARGET_IMAGE: $GCP_REGISTRY/linkding:$CI_COMMIT_SHORT_SHA
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/248896301327/locations/global/workloadIdentityPools/gitlab/providers/gitlab-com
  before_script:
    - apk add --no-cache --quiet skopeo curl
    - echo "$GCP_ID_TOKEN" > /tmp/gitlab_id_token
    - >
      gcloud iam workload-identity-pools create-cred-config "$GCP_IDENTITY_PROVIDER"
      --service-account="$GCP_DEPLOYER"
      --credential-source-file=/tmp/gitlab_id_token
      --output-file=/tmp/gcp_credentials.json
    - gcloud auth login --cred-file=/tmp/gcp_credentials.json
  script:
    # Cloud Run cannot pull from the GitLab registry, so copy the image that
    # this pipeline built and tested into Artifact Registry.
    - >
      skopeo copy
      --src-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD"
      --dest-creds "oauth2accesstoken:$(gcloud auth print-access-token)"
      "docker://$APP_IMAGE" "docker://$TARGET_IMAGE"
    # Only the image changes. Everything else about the service is owned by infra/.
    - gcloud run deploy "$SERVICE" --image "$TARGET_IMAGE" --region "$GCP_REGION"
    # Check that the new revision is the one serving and that it reaches its database.
    - |
      RUNNING=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format 'value(spec.template.spec.containers[0].image)')
      if [ "$RUNNING" != "$TARGET_IMAGE" ]; then
        echo "Expected $TARGET_IMAGE but the service runs $RUNNING"
        exit 1
      fi
    - |
      for attempt in $(seq 1 24); do
        HEALTH=$(curl --silent --max-time 20 "$SERVICE_URL/health" || true)
        if echo "$HEALTH" | grep -q healthy; then break; fi
        sleep 5
      done
      echo "$SERVICE_URL/health -> $HEALTH"
      echo "$HEALTH" | grep -q healthy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-staging:
  extends: .deploy
  stage: staging
  resource_group: staging
  environment:
    name: staging
    url: https://linkding-staging-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app
    deployment_tier: staging

deploy-production:
  extends: .deploy
  stage: production
  resource_group: production
  environment:
    name: production
    url: https://linkding-production-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app
    deployment_tier: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# Records what went to production: a tag on the deployed commit and a release
# page listing the changes since the previous release.
create-release:
  stage: production
  image: alpine:3.22
  interruptible: false
  needs:
    - deploy-production
  variables:
    GIT_DEPTH: 0
    PRODUCTION_URL: https://linkding-production-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app
  script:
    - apk add --no-cache --quiet curl git jq
    - TAG="v$(cat version.txt)-r$CI_PIPELINE_IID"
    - PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*-r*' 2>/dev/null || true)
    - |
      if [ -n "$PREVIOUS" ]; then
        CHANGES=$(git log --no-merges --pretty='- %s (%h)' "$PREVIOUS..$CI_COMMIT_SHA")
        SINCE="Changes since $PREVIOUS"
      else
        CHANGES="- First release from the GitLab pipeline"
        SINCE="Changes"
      fi
    - |
      NOTES=$(printf '%s\n\n%s\n%s\n%s\n\n## %s\n\n%s\n' \
        "Deployed to production by pipeline [#$CI_PIPELINE_IID]($CI_PIPELINE_URL)." \
        "- Commit: $CI_COMMIT_SHA" \
        "- Image: \`$GCP_REGISTRY/linkding:$CI_COMMIT_SHORT_SHA\`" \
        "- Environment: $PRODUCTION_URL" \
        "$SINCE" "$CHANGES")
    - |
      jq -n --arg tag "$TAG" --arg ref "$CI_COMMIT_SHA" --arg notes "$NOTES" --arg url "$PRODUCTION_URL" \
        '{name: $tag, tag_name: $tag, ref: $ref, description: $notes,
          assets: {links: [{name: "Production", url: $url, link_type: "other"}]}}' > release.json
    - >
      curl --fail-with-body --silent --show-error --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json"
      --data @release.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" | jq -r '._links.self'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------- Slack bot
# The bot in slackbot/ is a second, small service: the maintainer discusses a
# change with GitLab Duo in Slack, the bot creates the issue and reports its
# progress. These jobs run only when the bot itself changes.

test-bot:
  stage: build
  image: python:3.13-slim
  script:
    - cd slackbot
    - pip install --quiet --root-user-action=ignore --requirement requirements.txt pytest==9.1.1 ruff==0.17.0
    - ruff check bot tests
    - ruff format --check bot tests
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: slackbot/report.xml
  rules:
    - changes:
        - slackbot/**/*

build-bot:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --tag "$BOT_IMAGE" slackbot
    # Smoke test: the service answers and the Duo CLI inside the image runs
    - docker run --detach --name bot --env BOT_LOCAL=1 "$BOT_IMAGE"
    - |
      for i in $(seq 1 20); do
        docker exec bot curl --fail --silent http://localhost:8080/health && break
        sleep 2
      done
    - docker exec bot curl --fail --silent http://localhost:8080/health | grep healthy || { docker logs bot; exit 1; }
    - docker exec bot duo --version
    - docker push "$BOT_IMAGE"
  rules:
    - changes:
        - slackbot/**/*

deploy-bot:
  extends: .deploy
  stage: staging
  resource_group: bot
  needs:
    - test-bot
    - build-bot
  variables:
    SERVICE: linkding-bot
    SERVICE_URL: https://linkding-bot-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app
    APP_IMAGE: $BOT_IMAGE
    TARGET_IMAGE: $GCP_REGISTRY/slackbot:$CI_COMMIT_SHORT_SHA
  environment:
    name: bot
    url: https://linkding-bot-$GCP_PROJECT_NUMBER.$GCP_REGION.run.app
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - slackbot/**/*
