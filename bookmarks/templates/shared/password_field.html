{% load static %}
{% load shared %}
<ld-password-toggle class="password-toggle">
  {% formfield field class='form-input' %}
  <button type="button"
          class="btn btn-link password-toggle-button"
          aria-label="Show password">
    <svg class="icon-show" aria-hidden="true" width="20" height="20">
      <use href="{% static 'icons.svg' %}?v={{ app_version }}#eye"></use>
    </svg>
    <svg class="icon-hide" aria-hidden="true" width="20" height="20" hidden>
      <use href="{% static 'icons.svg' %}?v={{ app_version }}#eye-off"></use>
    </svg>
  </button>
</ld-password-toggle>
